<style>
/* The death screen. Self-contained on purpose: a 404 can be served from any
   path on either host, so nothing here points at another file. */
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#2B0A10;
  /* the game's red wash is dithered, so this one is too */
  background-image:conic-gradient(rgba(0,0,0,.25) 90deg,transparent 90deg 180deg,
    rgba(0,0,0,.25) 180deg 270deg,transparent 270deg);
  background-size:8px 8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:#F4ECE2;text-align:center;
}
main{display:flex;flex-direction:column;align-items:center;gap:1.3rem;padding:2rem}
h1{
  margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:800;font-size:clamp(3rem,10vw,5.5rem);line-height:1;
  letter-spacing:-.015em;text-shadow:.05em .06em 0 rgba(0,0,0,.6);
}
.score{font-size:1.15rem;color:#FFC857;margin:0}
p{margin:0;color:#D8B9BC;max-width:38ch;line-height:1.6}
.acts{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin-top:.7rem}
a{
  display:inline-block;padding:1rem 1.8rem;text-decoration:none;
  font-weight:700;font-size:1rem;color:#F4ECE2;background:#5A2028;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 2px 0 0 rgba(255,255,255,.07),
    inset 0 -2px 0 rgba(0,0,0,.45),inset -2px 0 0 rgba(0,0,0,.28),0 4px 0 #1D060A;
}
a:hover{background:#6E2731}
a:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.16),
  inset 2px 0 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.45),
  inset -2px 0 0 rgba(0,0,0,.28),0 0 0 #1D060A}
:focus-visible{outline:3px solid #FFC857;outline-offset:3px}
</style>
